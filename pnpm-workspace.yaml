packages:
  - "apps/*"
  - "packages/*"

# Dependências autorizadas a executar scripts de build (binários nativos).
allowBuilds:
  bcrypt: true
  esbuild: true
  "@tailwindcss/oxide": true
  workerd: true
  msgpackr-extract: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
