# =============================================================================
# Nginx — publicação da plataforma Mentalidade
#
# Pré-requisitos na VPS:
#   - Frontend compilado em /var/www/mentalidade/web (copiar apps/web/dist)
#   - API em execução via PM2 na porta 3344 (pm2 startOrReload ecosystem.config.cjs)
#   - Certificados TLS gerados com Certbot (Let's Encrypt)
#
# Ajuste "mentalidade.exemplo.com" para o domínio real antes de publicar.
# =============================================================================

# Bloco de compressão (aplicado globalmente quando incluído no http{}).
gzip on;
gzip_types text/plain text/css application/json application/javascript
           application/manifest+json image/svg+xml;
gzip_min_length 1024;

# Redireciona todo o tráfego HTTP para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mentalidade.exemplo.com;

    # Diretório usado pelo Certbot durante a validação do domínio.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS principal.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mentalidade.exemplo.com;

    ssl_certificate /etc/letsencrypt/live/mentalidade.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentalidade.exemplo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Cabeçalhos de segurança.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Frontend estático (SPA) servido diretamente pelo Nginx.
    root /var/www/mentalidade/web;
    index index.html;

    # API — proxy reverso para o processo gerenciado pelo PM2.
    location /api/ {
        proxy_pass http://127.0.0.1:3344;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentação interativa da API (Swagger).
    location /api-docs {
        proxy_pass http://127.0.0.1:3344;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker e manifest nunca devem ser cacheados agressivamente.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Recursos com hash no nome podem ser cacheados por longos períodos.
    location ~* \.(?:js|css|woff2?|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rotas da SPA são resolvidas pelo index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
